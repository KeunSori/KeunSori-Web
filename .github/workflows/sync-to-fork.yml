name: Synchronize to forked repo

on:
  push:
    branches: [main, develop]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "BeanMouse"
          git config user.email "BeanMouse@users.noreply.github.com"

      - name: Remove workflows before syncing
        run: |
          rm -rf .github/workflows || true

      - name: Force sync branch to fork (safe auth)
        env:
          FORKED_REPO_TOKEN: ${{ secrets.FORKED_REPO_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          AUTH="$(printf "x-access-token:%s" "$FORKED_REPO_TOKEN" | base64 -w 0)"
          git -c http.extraheader="Authorization: Basic $AUTH" \
            push --force https://github.com/BeanMouse/KeunSori-Web.git "HEAD:${BRANCH}"
